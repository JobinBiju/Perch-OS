<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Perch Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg: #f2f2f7; --card: #fff; --line: #e5e5ea; --edge: #c8c8ce; --text: #14141a; --dim: #6a6a75; --blue: #0071e3; --bluebg: #e8f2ff; --green: #15803d; --greenbg: #e3f6ea; --red: #c8102e; --redbg: #fdeceb; --off: #ececf1; }

  .row { display: flex; align-items: center; } .grow { flex: 1; min-width: 0; }

  /* buttons: pills 36 / 40 high */
  .btn { background: var(--card); color: var(--text); border: 1px solid var(--edge); height: 36px; padding: 0 16px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 20px; white-space: nowrap; flex: none; }
  .btn:hover { text-decoration: none; background: #fafafc; }
  .btn.lg { height: 40px; border-radius: 20px; font-size: 15px; }
  .btn.pri { background: var(--blue); color: #fff; border: 0; } .btn.pri:hover { background: #0068d1; }
  .btn.danger { background: none; color: var(--red); border-color: #f3c2c0; }
  .btn:disabled { background: var(--off); color: #a0a0aa; border: 0; }

  header.top { height: 64px; background: var(--card); border-bottom: 1px solid var(--line); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--text); } .brand:hover { text-decoration: none; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--text); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .brand b { font-size: 18px; font-weight: 700; } .brand i { width: 1px; height: 18px; background: var(--edge); }
  .paired { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .pairpill { display: none; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; background: var(--greenbg); color: var(--green); font-size: 13px; font-weight: 600; border: 0; }
  main { width: 1040px; max-width: calc(100% - 48px); margin: 0 auto; padding: 32px 0 64px; display: flex; flex-direction: column; gap: 36px; }
  section { display: flex; flex-direction: column; gap: 16px; }

  .head h2 { font-size: 22px; font-weight: 700; line-height: 28px; } .head .t { display: flex; align-items: baseline; gap: 12px; }

  /* devices */
  .devs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .dev { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .tile { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .dev .name { font-size: 17px; font-weight: 600; line-height: 24px; }
  .pill { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
  .pill.on { background: var(--greenbg); color: var(--green); } .pill.off { background: var(--off); color: var(--dim); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #34c759; } .pill.off i { background: #a0a0aa; }
  .stats { display: flex; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stats > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .stats b { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .stats span { font-size: 12px; line-height: 16px; color: var(--dim); white-space: nowrap; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; font-size: 13px; line-height: 18px; color: var(--dim); }
  .tag { height: 20px; padding: 0 8px; border-radius: 10px; background: var(--bg); color: var(--text); font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; }
  .dev .mini { display: none; }

  /* library */
  .search { width: 260px; height: 40px; border-radius: 20px; background: var(--card); border: 1px solid var(--edge); padding: 0 14px; display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .search input { border: 0; outline: 0; background: none; font: inherit; color: var(--text); width: 100%; } .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px var(--bluebg); }
  .drop { height: 72px; border-radius: 16px; border: 1.5px dashed var(--edge); display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--dim); background: none; width: 100%; padding: 0 16px; text-align: left; }
  .drop b { color: var(--text); font-weight: 600; } .drop.over, body.dragging .drop { border-color: var(--blue); background: var(--bluebg); }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .cols, .book { display: grid; grid-template-columns: 40px minmax(0, 1fr) 240px 160px 32px; column-gap: 20px; align-items: center; padding: 0 20px; }
  .cols { height: 40px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); }
  .book { height: 80px; border-bottom: 1px solid var(--line); color: var(--text); } .book:last-child { border-bottom: 0; } .book:hover { text-decoration: none; background: #fafafc; }

  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .book .ti { font-size: 16px; font-weight: 600; line-height: 22px; }
  .chips { display: flex; gap: 6px; min-width: 0; }
  .chip { height: 24px; padding: 0 8px; border-radius: 12px; background: var(--bg); border: 1px solid transparent; font-size: 13px; font-weight: 500; line-height: 22px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
  .chip.off { background: none; color: var(--dim); border: 1px dashed var(--edge); }
  .prog { display: inline-flex; align-items: center; gap: 10px; } .bar { position: relative; width: 88px; height: 6px; border-radius: 3px; background: var(--line); flex: none; } .bar i { position: absolute; left: 0; top: 0; height: 6px; border-radius: 3px; background: var(--text); }
  .prog b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .new { height: 22px; padding: 0 8px; border-radius: 11px; background: var(--bluebg); color: var(--blue); font-size: 12px; font-weight: 700; line-height: 22px; letter-spacing: .3px; display: inline-block; }
  .more { width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; }
  .empty { padding: 36px 20px; text-align: center; color: var(--dim); }
  .fab { display: none; }

  /* dialog */
  .scrim { position: fixed; inset: 0; background: rgba(20,20,26,.42); display: flex; align-items: flex-start; justify-content: center; padding: 96px 16px 24px; overflow: auto; z-index: 10; }
  .dialog { width: 560px; max-width: 100%; background: var(--card); border-radius: 20px; box-shadow: 0 24px 64px rgba(20,20,26,.28); padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .dialog h2 { font-size: 22px; font-weight: 700; line-height: 28px; } .grab { display: none; }
  .x { width: 32px; height: 32px; border-radius: 16px; background: var(--bg); border: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .file { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); } .file:last-child { border-bottom: 0; }
  .fic { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--bluebg); } .fic.ok { background: var(--greenbg); } .fic.err { background: var(--redbg); }
  .file .st { font-size: 13px; line-height: 18px; color: var(--dim); display: flex; align-items: center; gap: 8px; min-height: 18px; } .file.err .st { color: var(--red); }
  .thin { position: relative; flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; } .thin i { position: absolute; left: 0; top: 0; height: 4px; border-radius: 2px; background: var(--blue); }
  .thin.busy i { width: 40%; animation: slide 1.1s linear infinite; } @keyframes slide { from { left: -40%; } to { left: 100%; } }
  .rm { width: 28px; height: 28px; border-radius: 14px; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; } .rm:hover { background: var(--bg); }
  .morefiles { height: 44px; border-radius: 12px; border: 1.5px dashed var(--edge); background: none; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .cap { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); }
  .target { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .target.sel { border-color: var(--blue); background: var(--bluebg); } .target.dis { cursor: default; } .target.dis .b { color: var(--dim); }
  .target input { position: absolute; opacity: 0; pointer-events: none; }
  .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--edge); background: var(--card); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .sel .box, .box.on { background: var(--blue); border-color: var(--blue); } .dis .box { background: var(--bg); border-color: var(--line); }
  .dfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; flex-wrap: wrap; }

  /* book page */
  .back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 32px; color: var(--dim); font-weight: 600; }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; } .facts div { display: flex; flex-direction: column; gap: 2px; } .facts b { font-weight: 600; }
  .bookpage h1 { font-size: 32px; font-weight: 800; line-height: 40px; letter-spacing: -.4px; }
  .sub h2 { font-size: 17px; font-weight: 700; line-height: 24px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px; }
  .copy { min-height: 72px; display: grid; grid-template-columns: 44px 200px minmax(0, 1fr) 104px; column-gap: 16px; align-items: center; border-bottom: 1px solid var(--line); } .copy:last-child { border-bottom: 0; }

  .chap { height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); } .chap:last-child { border-bottom: 0; } .chap .n { width: 28px; color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }

  .paircard { width: 460px; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 24px; }

  .devchip { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 14px; background: var(--bg); }
  .code { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .code input { width: 56px; height: 68px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--edge); text-align: center; font: inherit; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); outline: 0; padding: 0; }
  .code input:focus { border: 2px solid var(--blue); box-shadow: 0 0 0 4px var(--bluebg); } .code i { width: 10px; height: 2px; border-radius: 1px; background: var(--edge); }

  .wide { height: 48px; border-radius: 14px; width: 100%; font-size: 15px; }
  .msg { text-align: center; font-size: 13px; color: var(--red); min-height: 18px; margin-top: -12px; }
  .field { display: flex; flex-direction: column; gap: 6px; } .field input { height: 44px; border-radius: 12px; border: 1px solid var(--edge); padding: 0 14px; font: inherit; color: var(--text); outline: 0; width: 100%; min-width: 0; } .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px var(--bluebg); }
  .syncline { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--dim); padding: 0 4px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

  @media (max-width: 760px) {
    header.top { height: 56px; padding: 0 16px; } .logo { width: 30px; height: 30px; border-radius: 8px; } .brand i, .brand .dim, .paired, .forget { display: none; } .pairpill { display: inline-flex; }
    main { max-width: 100%; width: 100%; padding: 20px 0 96px; gap: 24px; } section { gap: 12px; } .head { padding: 0 16px; } .head h2 { font-size: 20px; }
    .devs { display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; } .devs::-webkit-scrollbar { display: none; }
    .dev { flex: none; width: 156px; padding: 14px; gap: 10px; } .dev .full { display: none; } .dev .mini { display: block; } .dev .tile { width: 40px; height: 40px; border-radius: 10px; }
    .dev .toprow { justify-content: space-between; } .dev .name { font-size: 16px; line-height: 22px; } .dev .pill { background: none; padding: 0; height: auto; }
    .scan span, .addbtn { display: none; } .scan { width: 36px; padding: 0; }
    .lib { padding: 0 16px; } .lib .head { padding: 0; } .search { width: 160px; } .drop { display: none; } .cols { display: none; }
    .book { display: flex; height: auto; gap: 12px; padding: 12px 14px; align-items: center; } .cover { width: 44px; height: 62px; font-size: 14px; }
    .book .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; } .book .ti { font-size: 15px; line-height: 20px; }
    .book .under { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; } .book .bar { width: 40px; } .more, .book > .chips, .book > .pr { display: none; }
    .fab { display: inline-flex; position: fixed; right: 16px; bottom: 20px; height: 52px; border-radius: 26px; padding: 0 20px; box-shadow: 0 8px 24px rgba(0,113,227,.35); z-index: 5; }
    .scrim { align-items: flex-end; padding: 0; } .dialog { width: 100%; border-radius: 24px 24px 0 0; padding: 10px 16px 28px; gap: 16px; max-height: 92vh; overflow: auto; } .dialog h2 { font-size: 20px; }
    .grab { display: block; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--edge); } .x { width: 36px; height: 36px; border-radius: 18px; }
    .dfoot .btn { flex: 1; } .dfoot > span { width: 100%; }
    .bookmain { padding: 0 16px; gap: 20px; } .bookpage { grid-template-columns: 1fr; row-gap: 20px; } .bookpage .left { flex-direction: row; gap: 16px; align-items: flex-end; } .bookpage .left .facts { flex: 1; }
    .bigcover { width: 120px; height: 172px; font-size: 32px; border-radius: 8px; } .bookpage h1 { font-size: 24px; line-height: 30px; }
    .copy { grid-template-columns: 40px minmax(0, 1fr) auto; row-gap: 6px; padding: 12px 0; } .copy .pr { grid-column: 2 / 4; } .copy .act { grid-row: 1; grid-column: 3; } .copy .tile { width: 40px; height: 40px; }
    .panel { padding: 4px 14px; } .delrow { flex-direction: column; align-items: stretch; }
    .paircard { padding: 28px 20px; border-radius: 20px; } .code { gap: 6px; } .code input { width: 44px; height: 56px; font-size: 24px; }
  }
  @media (min-width: 761px) { .book .mid .under { display: none; } }
</style>

<script>

// types the code shown on it; the page keeps a token per device and merges their libraries.

    const ok = f.status === "ready" || f.status === "sent", err = f.status === "error";
    const st = f.status === "converting" || f.status === "queued" ? `<span class="thin busy"><i></i></span><span>${f.status === "queued" ? "Waiting" : "Converting…"}</span>` : f.status === "sending" ? `<span class="thin"><i style="width:${f.pct | 0}%"></i></span><span>${esc(f.msg)}</span>` : esc(f.msg);
    return `<div class="file${err ? " err" : ""}"><span class="fic${ok ? " ok" : err ? " err" : ""}">${ic(ok ? "check" : err ? "alert" : "book", 18, ok ? "#15803d" : err ? "#c8102e" : "#0071e3")}</span>
      <span class="grow"><span class="b ell" style="display:block;line-height:20px">${esc(f.title || f.name)}</span><span class="st">${st}</span></span>
      <button class="rm" aria-label="Remove" data-act="rmfile" data-k="${k}" ${a.sending ? "disabled" : ""}>${ic("x", 16, "#6a6a75")}</button></div>`;
  }).join("");
  const targets = devs.map(d => {
    const can = d.online && d.paired, sel = can && a.targets.has(d.id), st = (d.info || {}).storage || {};
    return `<label class="target${sel ? " sel" : ""}${can ? "" : " dis"}"><input type="checkbox" data-target="${esc(d.id)}" ${sel ? "checked" : ""} ${can && !a.sending ? "" : "disabled"}><span class="box">${sel ? ic("check", 14, "#fff", 3) : ""}</span>
      <span class="grow"><span class="b" style="display:block;line-height:20px">${esc(d.name)}</span><span class="s13 dim ell" style="display:block">${!d.online ? "Offline. It will not receive these now" : !d.paired ? "Not paired with this browser" : fmt(st.free || 0) + " free"}</span></span>${ic(d.type === "epaper" ? "epaper" : "lcd", 18, can ? "#14141a" : "#6a6a75", 1.75)}</label>`;
  }).join("");
  const count = [...a.targets].filter(id => S.devs[id] && S.devs[id].online && S.devs[id].paired).length;
  const sum = [n.ready && n.ready + " ready", n.conv && n.conv + " converting", n.skip && n.skip + " skipped"].filter(Boolean).join(" · ") || "Choose EPUB files to add";
  return `<div class="scrim" data-act="closeadd"><div class="dialog" role="dialog" aria-label="Add books"><span class="grab"></span>
    <div class="row" style="justify-content:space-between"><h2>Add books</h2><button class="x" aria-label="Close" data-act="closeadd">${ic("x", 18)}</button></div>
    ${files ? `<div>${files}</div>` : ""}
    <button class="morefiles" data-act="choose" ${a.sending ? "disabled" : ""}>${ic("plus", 16)}${a.items.length ? "Add more files" : "Choose EPUB files"}</button>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="cap">Send to</div><div style="display:flex;flex-direction:column;gap:8px">${targets}</div></div>
    <div class="dfoot"><span class="s13 dim">${sum}</span><div class="row" style="gap:12px;flex:1;justify-content:flex-end"><button class="btn lg" data-act="closeadd">${a.done ? "Done" : "Cancel"}</button>
      <button class="btn lg pri" data-act="send" ${!a.sending && n.ready && !n.conv && count && !a.done ? "" : "disabled"}>${ic("send", 16)}${a.sending ? "Sending…" : "Send to " + count + (count === 1 ? " device" : " devices")}</button></div></div></div></div>`;
}

function syncDialog() {
  const y = S.sync, n = usable().length;
  return `<div class="scrim" data-act="closesync"><div class="dialog" role="dialog" aria-label="Cloud sync"><span class="grab"></span>
    <div class="row" style="justify-content:space-between"><h2>Cloud sync</h2><button class="x" aria-label="Close" data-act="closesync">${ic("x", 18)}</button></div>
    <p class="dim">Your devices save where you are in each book to your own sync service and pick up the newest position when a book is opened. They all need the same address and home key; saving here sends both to every paired device that is online.</p>
    <label class="field"><span class="cap">Service address</span><input id="surl" type="url" placeholder="https://perch-sync.example.workers.dev" value="${esc(y.url)}"></label>
    <label class="field"><span class="cap">Home key</span><span class="row" style="gap:8px"><input id="skey" type="text" autocomplete="off" spellcheck="false" placeholder="a long random key" value="${esc(y.key)}"><button class="btn lg" type="button" data-act="genkey">Generate</button></span></label>
    <div class="s13" style="color:${y.bad ? "var(--red)" : "var(--dim)"};min-height:18px">${esc(y.msg || "Anyone with the key can read and change your positions. Keep it private.")}</div>
    <div class="dfoot"><button class="btn lg danger" data-act="syncoff">Turn off</button><div class="row" style="gap:12px;flex:1;justify-content:flex-end"><button class="btn lg" data-act="closesync">Cancel</button>
      <button class="btn lg pri" data-act="savesync">Save to ${n} ${n === 1 ? "device" : "devices"}</button></div></div></div></div>`;
}
async function saveSync(url, key) {
  const devs = usable(), bad = [];
  for (const d of devs) { try { await post(d, "/api/sync?url=" + encodeURIComponent(url) + "&key=" + encodeURIComponent(key)); } catch (e) { bad.push(d.name + ": " + e.message); } }
  if (bad.length) { S.sync.msg = bad.join("; "); S.sync.bad = true; S.sync.url = url; S.sync.key = key; return render(); }
  S.sync = null; toast(url ? "Cloud sync saved" : "Cloud sync turned off"); await refresh(false);
}
function render() {
  const app = $("#app"), q = document.activeElement && document.activeElement.id === "q", pos = q ? document.activeElement.selectionStart : 0;
  const m = /^#\/book\/(.+)$/.exec(location.hash);
  app.innerHTML = S.pairFor ? pairView() : (m ? bookView(decodeURIComponent(m[1])) : libraryView()) + (S.add ? addDialog() : "") + (S.sync ? syncDialog() : "");
  if (q && $("#q")) { $("#q").focus(); $("#q").setSelectionRange(pos, pos); }
  if (S.pairFor) wirePair(); else loadCovers();
}
function toast(t) { clearTimeout(S.toastT); let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); } el.textContent = t; S.toastT = setTimeout(() => el.remove(), 3500); }

// ---- pairing form: six boxes that behave like one field
function wirePair() {
  const boxes = [...document.querySelectorAll(".code input")], d = S.pairFor;
  boxes.forEach((b, i) => {
    b.oninput = () => {   // one digit a box; several at once (autofill, fast typing) spill into the boxes that follow
      const t = b.value.replace(/\D/g, ""); b.value = t.slice(0, 1);
      [...t.slice(1)].forEach((c, k) => { if (boxes[i + 1 + k]) boxes[i + 1 + k].value = c; });
      if (t) (boxes[Math.min(i + t.length, 5)] || b).focus();
    };
    b.onkeydown = e => { if (e.key === "Backspace" && !b.value && boxes[i - 1]) { boxes[i - 1].focus(); boxes[i - 1].value = ""; } };
    b.onpaste = e => { e.preventDefault(); const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6); [...t].forEach((c, k) => { if (boxes[k]) boxes[k].value = c; }); (boxes[Math.min(t.length, 5)] || b).focus(); };
  });
  if (boxes[0]) boxes[0].focus();
  $("#keep").onchange = e => e.target.nextElementSibling.classList.toggle("on", e.target.checked);
  $("#keep").nextElementSibling.onclick = () => {};
  $("#pairform").onsubmit = async e => {
    e.preventDefault(); const code = boxes.map(b => b.value).join(""), msg = $("#pairmsg");
    if (code.length !== 6) { msg.textContent = "Enter all six digits"; return; }
    try {
      const r = await fetch(base(d) + "/api/pair?code=" + code + "&keep=" + ($("#keep").checked ? 1 : 0), {method: "POST"});
      if (!r.ok) { msg.textContent = await r.text(); boxes.forEach(b => b.value = ""); boxes[0].focus(); return; }
      d.token = (await r.json()).token; d.paired = true; remember(d); S.pairFor = null; stopPairPoll(); await refresh(true);
    } catch (err) { msg.textContent = "Could not reach the device"; }
  };
  stopPairPoll(); S.pairPoll = setInterval(async () => {   // keep the countdown honest
    try { const i = await (await get(base(d) + "/api/info", 2500)).json(); d.info = i; const el = $("#left span"); if (el) el.textContent = i.pairing ? "A new code appears in 0:" + String(i.left).padStart(2, "0") : "Open Settings, then Portal on the device to see the code"; } catch (e) {}
  }, 2000);
}
function stopPairPoll() { clearInterval(S.pairPoll); }

// ---- adding books: convert here, then send the text (and cover) to each chosen device
let hyphReady = false;
function openAdd(files) {
  if (!S.add) S.add = {items: [], targets: new Set(usable().map(d => d.id)), sending: false, done: false};
  if (files) for (const f of files) {
    const it = {name: f.name, file: f, status: /\.epub$/i.test(f.name) ? "queued" : "error", msg: "Not an EPUB. Only .epub files can be added"};
    S.add.items.push(it);
  }
  render(); pump();
}
async function pump() {   // one conversion at a time
  const a = S.add; if (!a || a.busy) return; const it = a.items.find(f => f.status === "queued"); if (!it) return;
  a.busy = true; it.status = "converting"; render();
  try {
    if (!hyphReady) { try { BookConvert.setHyphenationPatterns(await (await fetch("/hyph-en-us.txt")).text()); } catch (e) {} hyphReady = true; }
    const zip = await JSZip.loadAsync(await it.file.arrayBuffer()), b = await BookConvert.convertEpub(zip);
    if (!b.chapters.length) throw new Error("No text found in this EPUB");
    it.title = b.title; it.text = b.text; it.slug = BookConvert.slug(b.title); it.cov = null;
    if (b.cover) { try { it.cov = await BookConvert.coverBytes(zip, b.cover); } catch (e) {} }
    it.status = "ready"; it.msg = [b.author, fmt(b.text.length), "ready"].filter(Boolean).join(" · ");
  } catch (e) { it.status = "error"; it.msg = e.message || "Could not read this file"; }
  a.busy = false; if (S.add === a) { render(); pump(); }
}
function upload(d, name, blob, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open("POST", withT(d, "/api/upload"));
    x.upload.onprogress = e => { if (e.lengthComputable && onp) onp(e.loaded / e.total); };
    x.onload = () => x.status === 200 ? res() : rej(new Error(x.responseText || "upload failed (" + x.status + ")")); x.onerror = () => rej(new Error("upload failed"));
    const fd = new FormData(); fd.append("file", blob, name); x.send(fd);
  });
}
async function sendAll() {
  const a = S.add, devs = [...a.targets].map(id => S.devs[id]).filter(d => d && d.online && d.paired); a.sending = true; let failed = 0;
  for (const it of a.items.filter(f => f.status === "ready")) {
    it.status = "sending"; let done = 0, bad = [];
    for (const d of devs) {
      it.msg = "Sending to " + d.name; it.pct = 100 * done / devs.length; render();
      try {
        await upload(d, it.slug, new Blob([it.text], {type: "text/plain"}), p => { it.pct = 100 * (done + p) / devs.length; const i = $(".file .thin:not(.busy) i"); if (i) i.style.width = it.pct + "%"; });
        if (it.cov) { try { await upload(d, it.slug.replace(/\.txt$/, ".cov"), new Blob([it.cov])); } catch (e) {} }
      } catch (e) { bad.push(d.name); }
      done++;
    }
    if (bad.length) { it.status = "error"; it.msg = "Not sent to " + bad.join(", "); failed++; } else { it.status = "sent"; it.msg = "Sent to " + devs.map(d => d.name).join(", "); }
    render();
  }
  a.sending = false; a.done = true; render(); await refresh(false);
  if (!failed && S.add === a) { S.add = null; render(); toast("Books sent"); }
}

// ---- actions
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return; const act = t.dataset.act;
  if (act === "closeadd") { if (e.target !== t && !e.target.closest("button[data-act=closeadd]")) return; if (S.add && S.add.sending) return; S.add = null; return render(); }
  if (act === "closesync") { if (e.target !== t && !e.target.closest("button[data-act=closesync]")) return; S.sync = null; return render(); }
  e.preventDefault();
  if (act === "sync") { S.sync = {url: "", key: "", msg: ""}; try { const j = await (await get(withT(S.self, "/api/sync"))).json(); S.sync.url = j.url; S.sync.key = j.key; if (j.err) S.sync.msg = "Last attempt failed: " + j.err; } catch (err) {} render(); }
  else if (act === "genkey") { const a = new Uint8Array(24); crypto.getRandomValues(a); $("#skey").value = [...a].map(b => b.toString(16).padStart(2, "0")).join(""); }
  else if (act === "savesync") { const url = $("#surl").value.trim().replace(/\/+$/, ""), key = $("#skey").value.trim(); if (!/^https:\/\//.test(url) || key.length < 24) { S.sync.url = url; S.sync.key = key; S.sync.msg = "Enter an https address and a key of at least 24 characters"; S.sync.bad = true; return render(); } saveSync(url, key); }
  else if (act === "syncoff") saveSync("", "");
  else if (act === "scan") { S.scanning = true; render(); refresh(true); }
  else if (act === "add") openAdd();
  else if (act === "choose") $("#pick").click();
  else if (act === "rmfile") { S.add.items.splice(+t.dataset.k, 1); render(); }
  else if (act === "send") sendAll();
  else if (act === "allch") { S.allCh = !S.allCh; render(); }
  else if (act === "pair") { S.pairFor = S.devs[t.dataset.id]; render(); }
  else if (act === "pairback") { S.pairFor = null; stopPairPoll(); render(); }
  else if (act === "forget") { if (!confirm("Forget this browser? You will need the code on the device to pair again.")) return; try { await post(S.self, "/api/unpair"); } catch (err) {} S.self.token = ""; S.self.paired = false; remember(S.self); S.pairFor = S.self; render(); }
  else if (act === "remove") {
    const d = S.devs[t.dataset.id], f = t.dataset.file; if (!confirm("Remove this book from " + d.name + "?")) return;
    try { await post(d, "/api/delete?file=" + encodeURIComponent(f)); toast("Removed from " + d.name); } catch (err) { toast("Could not remove it"); }
    await refresh(false); if (!library().some(b => b.file === f)) location.hash = "#/"; else loadDetail(f);
  } else if (act === "delall") {
    const f = t.dataset.file, b = library().find(x => x.file === f); if (!b || !confirm("Delete \"" + b.title + "\" from all your devices?")) return;
    for (const o of b.on) { if (o.d.online && o.d.paired) { try { await post(o.d, "/api/delete?file=" + encodeURIComponent(f)); } catch (err) {} } else { store.pending.push({id: o.d.id, file: f}); o.d.books = (o.d.books || []).filter(x => x.file !== f); remember(o.d); } }
    save(); toast("Deleted"); location.hash = "#/"; refresh(false);
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.target && S.add) { const id = e.target.dataset.target; e.target.checked ? S.add.targets.add(id) : S.add.targets.delete(id); render(); }
  if (e.target.id === "pick") { openAdd(e.target.files); e.target.value = ""; }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.query = e.target.value; render(); } });
let drag = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); if (++drag === 1) document.body.classList.add("dragging"); });
document.addEventListener("dragleave", e => { e.preventDefault(); if (--drag <= 0) { drag = 0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); drag = 0; document.body.classList.remove("dragging"); if (!S.pairFor && e.dataTransfer.files.length) openAdd(e.dataTransfer.files); });
window.addEventListener("hashchange", () => { S.allCh = false; S.detail = null; render(); const m = /^#\/book\/(.+)$/.exec(location.hash); if (m) loadDetail(decodeURIComponent(m[1])); window.scrollTo(0, 0); });
boot().then(() => { const m = /^#\/book\/(.+)$/.exec(location.hash); if (m && !S.pairFor) loadDetail(decodeURIComponent(m[1])); });
setInterval(() => { if (!S.pairFor && !S.add && !S.sync && document.visibilityState === "visible") refresh(false); }, 30000);
</script>
</body>
</html>
